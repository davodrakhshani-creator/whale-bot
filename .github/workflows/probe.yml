name: probe
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for U in https://api.anthropic.com/v1/messages https://api.openai.com/v1/models https://models.github.ai/catalog/models https://api.github.com/zen https://openrouter.ai/api/v1/models; do
            echo "== $U"; curl -si -m 20 "$U" -H "Authorization: Bearer $GITHUB_TOKEN" | head -c 400; echo
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}
