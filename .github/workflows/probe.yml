name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 120 -o /tmp/lb.json -w "http %{http_code} bytes %{size_download}\n" https://stats-data.hyperliquid.xyz/Mainnet/leaderboard
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/lb.json"))
          rows = d["leaderboardRows"]
          print("rows", len(rows)); print(json.dumps(rows[0])[:600])
          small = [r for r in rows if 5e3 <= float(r["accountValue"]) <= 3e5]
          print("small", len(small))
          def perf(r, w):
              for k, v in r["windowPerformances"]:
                  if k == w: return v
          c = [r for r in small if float(perf(r,"month")["pnl"]) > 3000 and float(perf(r,"month")["vlm"]) > 2e5 and float(perf(r,"allTime")["pnl"]) > 20000]
          print("candidates", len(c))
          for r in sorted(c, key=lambda r: -float(perf(r,"month")["roi"]))[:5]: print(r["ethAddress"], r["accountValue"], perf(r,"month"))
          PY
