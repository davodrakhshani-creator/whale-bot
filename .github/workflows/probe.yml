name: probe
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H='-H Accept:application/vnd.github+json -H X-GitHub-Api-Version:2022-11-28'
          echo "== A catalog"; curl -si -m 20 https://models.github.ai/catalog/models -H "Authorization: Bearer $GITHUB_TOKEN" $H | head -c 700; echo
          echo "== B chat new endpoint"; curl -si -m 60 https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" $H -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Say hi in JSON {\"hi\":1}"}],"max_tokens":30}' | head -c 900; echo
          echo "== C chat azure endpoint"; curl -si -m 60 https://models.inference.ai.azure.com/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d '{"model":"gpt-4.1-mini","messages":[{"role":"user","content":"hi"}],"max_tokens":20}' | head -c 700; echo
        env:
          GITHUB_TOKEN: ${{ github.token }}
