<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Whale Paper Bot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap">
<style>
:root{--bg:#F2F4F7;--s:#fff;--l:#DCE1E9;--fg:#101828;--m:#586275;--ac:#2753B8;--up:#12794A;--dn:#BE3030}
@media(prefers-color-scheme:dark){:root{--bg:#0D1220;--s:#151C2D;--l:#263149;--fg:#E7ECF5;--m:#95A1B8;--ac:#86A9FF;--up:#4BD497;--dn:#FF8080}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 Vazirmatn,system-ui,sans-serif;padding:14px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.w{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}h1{font-size:1.4rem;margin:0}h2{font-size:1rem;margin:6px 0 0}
.c{background:var(--s);border:1px solid var(--l);border-radius:12px;padding:12px 14px}.r{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.m{color:var(--m);font-size:.85rem}.big{font-size:1.9rem;font-weight:700}.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.bar{height:10px;border-radius:99px;background:var(--l);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
</style>
</head>
<body><div class="w">
<h1>Whale Paper Bot</h1>
<p class="m">کپی مجازی نهنگ‌ها، روی سرور GitHub. فقط داده‌ی عمومی می‌خونه و هیچ معامله‌ی واقعی نمی‌کنه.</p>
<div class="c"><div class="r"><span class="m">موجودی مجازی (با سود باز)</span><span class="m" id="upd"></span></div>
<div class="big n" id="eq">…</div><div class="bar"><i id="bar" style="width:0"></i></div>
<div class="r m"><span>شروع <span class="n">$1,000</span></span><span id="pct"></span><span>هدف <span class="n">$1,500</span></span></div></div>
<h2>پوزیشن‌های باز</h2><div id="open"></div>
<h2>آخرین رویدادها</h2><div id="ev"></div>
<h2>پوزیشن‌های بسته</h2><div id="cl"></div>
</div>
<script>
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function mo(n){return (n<0?"-$":"$")+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
var tz=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tehran",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
function tm(t){return tz.format(new Date(t))}
fetch("data.json?"+Date.now()).then(function(r){return r.json()}).then(function(d){
 $("eq").textContent=mo(d.equity);var p=Math.max(0,Math.min(1,(d.equity-d.start)/500))*100;
 $("bar").style.width=p+"%";$("pct").textContent=Math.round(p)+"٪ از مسیر هدف";$("upd").textContent="به‌روزرسانی "+tm(d.updated);
 var o=$("open");if(!d.open.length)o.appendChild(el("p","m","پوزیشن بازی نیست."));
 d.open.forEach(function(p){var c=el("div","c"),r=el("div","r");r.appendChild(el("b",null,p.tag+" · "+p.coin+" "+(p.side=="long"?"لانگ":"شورت")+" "+p.lev+"x"));
  r.appendChild(el("span","n "+(p.upnl>=0?"up":"dn"),p.upnl==null?"—":mo(p.upnl)));c.appendChild(r);
  c.appendChild(el("p","m n","ورود "+Number(p.entry.toPrecision(6))+(p.mark?" · الان "+Number(p.mark.toPrecision(6)):"")+" · "+tm(p.opened_at)));o.appendChild(c)});
 var e=$("ev");d.events.slice(0,25).forEach(function(x){var c=el("div","c");c.appendChild(el("span","m n",tm(x.t)+"  "));c.appendChild(document.createTextNode(x.text));e.appendChild(c)});
 var cl=$("cl");if(!d.closed.length)cl.appendChild(el("p","m","هنوز چیزی بسته نشده."));
 d.closed.slice(0,30).forEach(function(t){var c=el("div","c"),r=el("div","r");r.appendChild(el("b",null,t.tag+" · "+t.coin+" "+(t.side=="long"?"لانگ":"شورت")));
  r.appendChild(el("span","n "+(t.pnl>=0?"up":"dn"),mo(t.pnl)));c.appendChild(r);c.appendChild(el("p","m n",Number(t.entry.toPrecision(6))+" → "+Number(t.exit.toPrecision(6))+" · "+tm(t.closed_at)));cl.appendChild(c)});
}).catch(function(){$("eq").textContent="هنوز داده‌ای نیست (بعد از اولین اجرا پر می‌شه)"});
</script></body></html>
